  .badge {

  .card {

    border-radius: 12px;

  .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }

  .stat-change { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .up { color: var(--green); }
  .down { color: var(--red); }

  .fng-label { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .03em; }
  .fng-history { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  .fng-history div { font-size: 12px; color: var(--muted); }
  .fng-history .val { font-size: 16px; font-weight: 700; color: var(--text); display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: right;
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);

  tbody td { padding: 10px; text-align: right; border-bottom: 1px solid var(--border); }
  tbody td:first-child, tbody td:nth-child(2) { text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  .coin-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .coin-sym { color: var(--muted); font-weight: 500; font-size: 12px; }
  .rank { color: var(--muted); width: 24px; }
  .pill { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 12.5px; }
  .pill.up { background: var(--green-soft); }
  .pill.down { background: var(--red-soft); }
  .movers-card ul { list-style: none; margin: 0; padding: 0; }

  .refresh-note { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12.5px; padding: 10px 14px; border-radius: 10px; margin-bottom: 20px; }

function fmtUSD(n, opts={}) {
  if (n >= 1e12) return "$" + (n/1e12).toFixed(2) + "T";
  if (n >= 1e9) return "$" + (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n/1e6).toFixed(2) + "M";
  if (n < 1) return "$" + n.toFixed(4);
  return "$" + n.toLocaleString(undefined, { minimumFractionDigits: opts.min ?? 2, maximumFractionDigits: opts.max ?? 2 });
}
function pctSpan(v) {
  const cls = v > 0 ? "up" : v < 0 ? "down" : "flat";
  const sign = v > 0 ? "+" : "";
  return `<span class="pill ${cls}">${sign}${v.toFixed(1)}%</span>`;
}
function plainPct(v) {
  if (v === null || v === undefined || isNaN(v)) return `<span class="flat" style="font-weight:700;">—</span>`;
  const cls = v > 0 ? "up" : v < 0 ? "down" : "flat";
  const sign = v > 0 ? "+" : "";
  return `<span class="${cls}" style="font-weight:700;">${sign}${v.toFixed(1)}%</span>`;
}
